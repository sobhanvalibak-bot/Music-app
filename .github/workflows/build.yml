
name: Build APK and Auto Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: musicapp-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. دریافت مخزن
      - name: Checkout
        uses: actions/checkout@v4

      # 2. نصب Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. نصب Gradle 8.13
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 4. پیدا کردن پروژه
      - name: Find Project Folder
        id: project
        shell: bash
        run: |
          set -euo pipefail

          f=$(find . \
            -name settings.gradle.kts \
            -not -path './.git/*' \
            -not -path './_unzipped/*' \
            | head -n 1 || true)

          if [ -z "$f" ]; then
            z=$(find . \
              -name '*.zip' \
              -not -path './.git/*' \
              -not -path './_unzipped/*' \
              | head -n 1 || true)

            if [ -n "$z" ]; then
              mkdir -p _unzipped
              unzip -oq "$z" -d _unzipped

              f=$(find _unzipped \
                -name settings.gradle.kts \
                | head -n 1 || true)
            fi
          fi

          if [ -z "$f" ]; then
            echo "Project not found!"
            find . -maxdepth 4 -type f
            exit 1
          fi

          dir=$(dirname "$f")

          echo "dir=$dir" >> "$GITHUB_OUTPUT"

          echo "Project directory: $dir"

      # 5. بررسی Gradle
      - name: Verify Gradle
        run: |
          gradle --version

      # 6. محاسبه نسخه جدید
      - name: Calculate Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          latest=$(gh release list \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName' 2>/dev/null || true)

          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            major=1
            minor=4
          else
            latest=${latest#v}
            latest=${latest#V}

            IFS='.' read -r major minor patch <<< "$latest"

            if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ ]]; then
              echo "Invalid version: $latest"
              exit 1
            fi
          fi

          minor=$((minor + 1))

          if [ "$minor" -ge 10 ]; then
            major=$((major + 1))
            minor=0
          fi

          version="${major}.${minor}"
          tag="v${version}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          echo "Next release: $tag"

      # 7. ساخت APK
      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          gradle assembleDebug

      # 8. بررسی و جمع آوری APK
      - name: Collect APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out

          apk=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name '*.apk' \
            | head -n 1 || true)

          if [ -z "$apk" ]; then
            echo "APK not found!"
            exit 1
          fi

          cp "$apk" "out/MusicApp-${VERSION}.apk"

          cp "$apk" out/MusicApp.apk

          echo "APK successfully collected:"
          ls -lh out/

      # 9. ذخیره APK به عنوان Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicApp-${{ steps.version.outputs.version }}
          path: out/MusicApp-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30

      # 10. ساخت GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

          tag_name: ${{ steps.version.outputs.tag }}

          name: MusicApp ${{ steps.version.outputs.tag }}

          body: |
            # MusicApp ${{ steps.version.outputs.tag }}

            New automatic build.

            Version: ${{ steps.version.outputs.version }}

            Build: Successful

            APK: MusicApp-${{ steps.version.outputs.version }}.apk

          files: |
            out/MusicApp-${{ steps.version.outputs.version }}.apk

          draft: false
          prerelease: false
          make_latest: true

      # 11. پایان موفق
      - name: Build Summary
        if: success()
        run: |
          echo "## MusicApp Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK uploaded successfully" >> "$GITHUB_STEP_SUMMARY"
